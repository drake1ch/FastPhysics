; FastPhysics settings. Changes take effect the next time the game starts.

[FastPhysics]
; 1 = the fast constraint solver is used, 0 = the game runs with its own solver (the mod does nothing)
Enabled=1

; 1 = each physics tick starts from the contact set of the previous tick (checked and corrected,
; so the result is the same; just faster). 0 = every tick is solved from scratch.
WarmStart=1

; How often a statistics line is written to FastPhysics.log, in seconds
LogIntervalSeconds=30

; --- Big static builds -------------------------------------------------------------------
; Radius in metres of the sphere the game sweeps through the world to place its reflection probes
; (the game uses 32). Next to a build of tens of thousands of parts that sweep costs 40-50 ms every
; frame the camera moves; 8 brings it down to a few ms. 0 = keep the game's value.
ProbeSweepRadius=8
; 1 = skip a needless quadratic duplicate check when the bot navmesh registers the parts of a cell.
NavMeshFix=1

; --- Troubleshooting ---------------------------------------------------------------------
; Verify=N: for the first N solves after the game starts, the game's own solver runs as well and
; the difference between the two results and both timings go to FastPhysics.log (slower; 0 = off).
Verify=0
; Creations whose solver problem has fewer rows than this stay with the game's solver (0 = none).
MinRows=0
; 1 = problems the fast solver gives up on are written to FastPhysics_fail.bin for analysis.
DumpFailures=0
